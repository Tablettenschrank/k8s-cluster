apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-kong
  namespace: gateway-kong
spec:
  gatewayClassName: kong              # Kong's default GatewayClass
  listeners:
    # HTTP Listener (Port 80)
    - name: http-listener
      protocol: HTTP
      port: 80
      hostname: "*.k.k8s.tablettenschrank.de"
      allowedRoutes:
        namespaces:
          from: All                   # Allow routes from any namespace
    
    # HTTPS Listener (Port 443) - uncomment when you have a TLS certificate
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   hostname: "*.k.k8s.tablettenschrank.de"
    #   allowedRoutes:
    #     namespaces:
    #       from: All
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: kong-tls-secret
    
    # TCP Listener for custom services (e.g., databases, custom protocols)
    # - name: tcp-custom
    #   protocol: TCP
    #   port: 60025                   # High random port example
    #   allowedRoutes:
    #     namespaces:
    #       from: All
