apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway-traefik

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 37.4.0
    releaseName: traefik
    namespace: gateway-traefik
    includeCRDs: true
    valuesFile: values.yaml


resources:
  - namespace.yaml
  - gateway.yaml